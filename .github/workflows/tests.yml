name: Tests

on:
  push:
    # master is covered by the publish workflow, which calls this one
    branches-ignore: [master]
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # legacy floor
          - django-version: "2.2.0"
            python-version: "3.9"
            ddt-version: "3.8.1"
          - django-version: "3.2.0"
            python-version: "3.9"
            ddt-version: "4.0.0"
          - django-version: "4.2.0"
            python-version: "3.11"
            ddt-version: "4.2.0"
          # currently supported combinations
          - django-version: "4.2.0"
            python-version: "3.12"
            ddt-version: "4.4.0"
          - django-version: "5.2.0"
            python-version: "3.12"
            ddt-version: "5.2.0"
          - django-version: "5.2.0"
            python-version: "3.13"
            ddt-version: "7.1.0"
          - django-version: "6.1.0"
            python-version: "3.13"
            ddt-version: "7.1.0"
          - django-version: "6.1.0"
            python-version: "3.14"
            ddt-version: "7.1.0"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip version
      run: |
        python -m pip install -U pip

    - name: Install test requirements/linters
      run: pip install -r tests/requirements.txt

    - name: Install elastic_panel
      run: pip install -e .

    - name: Upgrade django version
      run: |
        python -m pip install "Django~=${{ matrix.django-version }}"
        python -m pip install "django-debug-toolbar~=${{ matrix.ddt-version }}"

    - name: Run pre-commit
      run: pre-commit run --all-files

    - name: Run tests with coverage
      run: pytest --cov=elastic_panel --cov-report=term-missing --cov-fail-under=100

repos:
    # CI runs `pre-commit run --all-files` (see .github/workflows/tests.yml)
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        stages: [pre-commit, pre-push, manual]
    -   id: check-json
        stages: [pre-commit, pre-push, manual]
    -   id: end-of-file-fixer
        stages: [pre-commit, pre-push, manual]
    -   id: trailing-whitespace
        stages: [pre-commit, pre-push, manual]
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit, pre-push, manual]
    -   id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        stages: [pre-commit, pre-push, manual]
    -   id: tests
        name: pytest
        entry: pytest
        pass_filenames: false
        language: system
        types: [python]
        stages: [pre-commit, pre-push, manual]
